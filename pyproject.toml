[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soil-core"
version = "0.1.0"
description = "The core implementation of the SOIL principles"
readme = "Readme.md"
requires-python = ">=3.12"

authors = [
  {name = "Christoph Hagen", email = "christoph.hagen@dlr.de"}
]

dependencies = [
  "websockets",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff>=0.17.1",
]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.unittest]
# unittest-spezifische Einstellungen für VS Code und andere Tools
start-discovery = true
verbose = 2
pattern = "test_*.py"
top-level-directory = "."

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["I001"]
"tests/**/__init__.py" = ["F401"]

[tool.ruff.lint]
ignore = [
    "TRY004",   # ValueError instead TypeError
    "C408",     # list()/dict() as empty constructor
    "BLE001",   # excepts
    "B008",     # Path()-Defaults
    "UP047",    # maybe later for refactoring
]

[tool.coverage.run]
source = ["soil"]

[dependency-groups]
dev = [
    "coverage>=7.16.2",
]
