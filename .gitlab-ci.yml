stages:
  - lint
  - test

workflow:        
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
    - when: never

default:
  tags: [docker]
  before_script:
    - python -m pip install --user --upgrade uv

lint:
  stage: lint
  image: python:3.12
  allow_failure: true
  script:
    - python -m uv tool run ruff check .

test:
  stage: test
  image: python:3.12
  script:
    - python -m uv sync
    - python -m uv run python -m unittest discover -s tests -v