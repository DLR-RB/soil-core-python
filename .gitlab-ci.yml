stages:
  - lint
  - test

default:
  before_script:
    - python3 -m pip install --user --upgrade uv

lint:
  stage: lint
  script:
    - python3 -m uv tool run ruff check .
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

test:
  stage: test
  script:
    - python3 -m uv sync
    - python3 -m uv run python -m unittest discover -s src -v
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"